name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest.txt

      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest.txt | head -40 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
          grep -E "^E  " pytest.txt | head -30 | while IFS= read -r line; do
            echo "::warning title=pytest detail::${line}"
          done
