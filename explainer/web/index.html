<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>clixy</title>
<style>
  :root { --accent: #ff5a3d; --on-accent: #fff; --s: 1; --ink: #0a0a12; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a12;
               font-family: Manrope, 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; }
  #backdrop { position: absolute; inset: -24px; background: #0a0a12 center / cover no-repeat; filter: blur(10px) saturate(1.1); }
  #scrim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, rgba(10,10,18,.46), rgba(10,10,18,.78)); }
  #stage, #leaders, #overlay { position: absolute; inset: 0; }
  #stage canvas { display: block; cursor: grab; }
  body.dragging #stage canvas { cursor: grabbing; }
  #leaders, #overlay { pointer-events: none; }
  #overlay > * { pointer-events: auto; }
  #overlay, #stage { opacity: 0; transition: opacity .45s ease; }
  body.in #overlay, body.in #stage { opacity: 1; }

  #title { position: absolute; left: calc(64px * var(--s)); top: calc(48px * var(--s)); color: #fff; font-weight: 200;
           font-size: calc(50px * var(--s)); letter-spacing: -0.5px; pointer-events: none; }
  #subtitle { position: absolute; left: calc(67px * var(--s)); top: calc(118px * var(--s)); color: rgba(255,255,255,.66);
              font-size: calc(22px * var(--s)); font-weight: 300; pointer-events: none; }
  #dots { position: absolute; left: calc(67px * var(--s)); top: calc(162px * var(--s)); display: flex; gap: calc(10px * var(--s)); }
  #dots i { width: calc(12px * var(--s)); height: calc(12px * var(--s)); border-radius: 99px; background: rgba(255,255,255,.35);
            cursor: pointer; transition: width .3s ease, background .3s ease; }
  #dots i.on { width: calc(46px * var(--s)); background: var(--accent); }

  #leaders path { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 1.8; }
  #leaders path.on { stroke: var(--accent); stroke-width: 2.6; }
  #leaders circle { fill: #fff; }
  #leaders circle.on { fill: var(--accent); }
  .label { position: absolute; transform: translate(-50%, -50%); background: #fff; color: var(--ink); font-weight: 500;
           font-size: calc(23px * var(--s)); padding: calc(9px * var(--s)) calc(20px * var(--s)); border-radius: 999px;
           white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.35); cursor: pointer;
           transition: background .25s ease, color .25s ease, transform .25s ease; }
  .label:hover { transform: translate(-50%, -50%) scale(1.04); }
  .label.on { background: var(--accent); color: var(--on-accent); transform: translate(-50%, -50%) scale(1.06); }

  #caption { position: absolute; left: 50%; bottom: calc(46px * var(--s)); transform: translateX(-50%); display: flex;
             align-items: center; gap: calc(16px * var(--s)); background: rgba(0,0,0,.88); border-radius: 999px;
             padding: calc(12px * var(--s)); max-width: calc(100vw - 48px); }
  #caption-chip { background: #ffd23f; color: var(--ink); font-weight: 600; font-size: calc(22px * var(--s));
                  padding: calc(11px * var(--s)) calc(19px * var(--s)); border-radius: 999px; white-space: nowrap; }
  #caption-text { color: #fff; font-weight: 300; font-size: calc(26px * var(--s)); white-space: nowrap; overflow: hidden;
                  text-overflow: ellipsis; }
  .round { width: calc(46px * var(--s)); height: calc(46px * var(--s)); border-radius: 99px; border: 0; cursor: pointer;
           background: rgba(255,255,255,.12); color: #fff; font: inherit; font-size: calc(20px * var(--s)); flex: none;
           display: grid; place-items: center; transition: background .2s ease; }
  .round:hover { background: rgba(255,255,255,.24); }
  #pause::before { content: '❚❚'; font-size: calc(14px * var(--s)); letter-spacing: -2px; }
  #pause.paused::before { content: '▶'; font-size: calc(17px * var(--s)); letter-spacing: 0; }

  #topbar { position: absolute; right: calc(40px * var(--s)); top: calc(44px * var(--s)); display: flex; gap: calc(10px * var(--s));
            align-items: center; }
  #topics { display: flex; gap: calc(8px * var(--s)); background: rgba(0,0,0,.55); padding: calc(6px * var(--s)); border-radius: 999px; }
  #topics button { border: 0; background: transparent; color: rgba(255,255,255,.78); font: inherit; font-weight: 500;
                   font-size: calc(17px * var(--s)); padding: calc(9px * var(--s)) calc(16px * var(--s)); border-radius: 999px;
                   cursor: pointer; white-space: nowrap; }
  #topics button:hover { background: rgba(255,255,255,.12); color: #fff; }
  #topics button.on { background: #fff; color: var(--ink); }
  @media (max-width: 1500px) {
    #topics { position: absolute; right: 0; top: calc(64px * var(--s)); flex-direction: column; align-items: stretch;
              border-radius: calc(22px * var(--s)); }
    #topics button { text-align: right; }
  }
  #close { background: #fff; color: var(--ink); font-size: calc(26px * var(--s)); width: calc(52px * var(--s)); height: calc(52px * var(--s)); }
  #close:hover { background: var(--accent); color: var(--on-accent); }

  #hint { position: absolute; left: calc(67px * var(--s)); top: calc(196px * var(--s)); color: rgba(255,255,255,.55);
          font-size: calc(15px * var(--s)); line-height: 1.6; pointer-events: none; }
  #hint b { color: rgba(255,255,255,.85); font-weight: 500; }

  #card { position: absolute; width: calc(400px * var(--s)); background: #fff; color: var(--ink); border-radius: calc(22px * var(--s));
          padding: calc(22px * var(--s)) calc(24px * var(--s)); box-shadow: 0 18px 50px rgba(0,0,0,.45);
          opacity: 0; transform: translateY(8px) scale(.97); transition: opacity .2s ease, transform .2s ease; pointer-events: none; }
  #card.on { opacity: 1; transform: none; pointer-events: auto; }
  #card-name { font-weight: 600; font-size: calc(24px * var(--s)); padding-right: calc(30px * var(--s)); }
  #card-name::after { content: '.'; color: var(--accent); }
  #card-info { font-weight: 300; font-size: calc(19px * var(--s)); line-height: 1.45; margin-top: calc(8px * var(--s)); color: #2a2a35; }
  #card-close { position: absolute; right: calc(14px * var(--s)); top: calc(14px * var(--s)); width: calc(32px * var(--s));
                height: calc(32px * var(--s)); background: #f1ede2; color: var(--ink); font-size: calc(16px * var(--s)); }

  body.no3d #caption, body.no3d #labels, body.no3d #leaders, body.no3d #dots, body.no3d #hint, body.no3d #ember { display: none; }
  #ember { position: absolute; width: calc(84px * var(--s)); image-rendering: pixelated; pointer-events: none;
           filter: drop-shadow(0 8px 14px rgba(0,0,0,.35)); opacity: 0; }
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="scrim"></div>
<div id="stage"></div>
<svg id="leaders" width="100%" height="100%"></svg>
<div id="overlay">
  <div id="title"></div><div id="subtitle"></div><div id="dots"></div>
  <div id="labels"></div>
  <div id="topbar"><div id="topics"></div><button class="round" id="close" title="Close (Esc)">✕</button></div>
  <div id="caption">
    <button class="round" id="prev" title="Back (←)">‹</button>
    <span id="caption-chip"></span><span id="caption-text"></span>
    <button class="round" id="pause" title="Pause (Space)"></button>
    <button class="round" id="next" title="Next (→)">›</button>
  </div>
  <div id="hint"><b>Drag</b> to turn · <b>scroll</b> to zoom<br><b>Click</b> any part · <b>Esc</b> to close</div>
  <div id="card"><button class="round" id="card-close">✕</button><div id="card-name"></div><div id="card-info"></div></div>
  <img id="ember" alt="">
</div>
<script src="clixy3d.js"></script>
</body>
</html>
